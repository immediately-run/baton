name: ci

# Baton's gate: the type check and the whole suite (unit tests and the S-BTN integration
# scenarios, BATON_SPEC §13a) on every pull request and on main. docs is private, so this job
# cannot see it: the vendored library and the board fixtures are checked against their
# manifest and recorded shas here, and against docs itself wherever an agent runs the suite
# beside a docs checkout (R-BTN-37). Deploying is R3-1207's workflow, not this one.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:wiki   # content/, the tickets' wiki
      - run: npm run check:spec   # spec/BATON_SPEC.md defines every R-BTN-n the code cites

  # The model's simulation, witnesses, 1,000-trace replay and Apalache proof do not run here
  # (R-BTN-68, amended 2026-10-17): they outgrew hosted runners' time limits, so the author runs
  # `npm run model:full` and pastes its report, stamped with the commit, into the PR, which
  # model-report.yml checks against the head. npm test
  # above keeps the deterministic part: the model's typecheck and regression runs, the scenario
  # traces checked against it, the @impl/@model links and 200 model-drawn traces driving the core.
