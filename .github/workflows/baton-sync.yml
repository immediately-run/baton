name: baton sync
on:
  push:
    branches: [main]
  workflow_dispatch:
  # A backstop for a missed trigger (§7.1): a run that finds nothing new posts nothing.
  schedule:
    - cron: '*/15 * * * *'
permissions:
  id-token: write
  contents: read
  pull-requests: read
  checks: read
# One run at a time, one pending (§7.1): runs never race for observation numbers.
concurrency:
  group: baton-sync
  cancel-in-progress: false
jobs:
  sync:
    # Off until the repository variable BATON_ENABLED is 'true' — set once the repository is
    # registered with Baton (§7.1), so an unregistered repository's pushes fail nothing.
    if: vars.BATON_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The CLI's version is pinned: a release changes nothing here until this ref moves.
      - uses: actions/checkout@v4
        with:
          repository: immediately-run/baton
          ref: 838b5ec6dfe613ab98fc8be1ee8cba8d0a6a7291
          path: .baton-cli
      - run: npm ci --prefix .baton-cli
      # --latest main: after its observation number the run reads the newest main, so a slow
      # run for an older push still posts the newest board (§7.1 step 2).
      # --busy-retry: another run's reading in flight is not this run's post; this waits a minute
      # and takes a fresh number once (B-89).
      - id: sync
        run: |
          set -o pipefail
          node .baton-cli/cli/baton.mjs repo sync --latest main --busy-retry 60 2>&1 | tee sync.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # B-89: a run that posted nothing is an annotation, never a green check — a held board
      # from another run's reading in flight (`busy:again`), or any failed post. The step above
      # fails on either, so this runs even then (`!cancelled()`).
      - name: A sync that posted nothing is not a success
        if: ${{ !cancelled() }}
        run: |
          outcome="$(grep -oE '^baton: [a-z][a-z:-]* at' sync.log | tail -n 1 | cut -d' ' -f2)"
          case "$outcome" in
            advanced|confirmed|held)
              echo "::notice title=baton sync::the board is posted — $outcome" ;;
            busy|busy:again)
              echo "::warning title=baton sync held::another run's reading was in flight (R-BTN-62); this run posted nothing. A stale reading lapses within minutes — dispatch baton-sync.yml to post the board now" ;;
            *)
              echo "::error title=baton sync failed::the run posted nothing (outcome: ${outcome:-none}); see the sync step's log" ;;
          esac
