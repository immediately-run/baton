name: model-report

# R-BTN-68 (amended 2026-10-17): the model is checked on the author's machine, not here. A PR
# that changes what the model checks read (the model, the core and its imports, the replay, the
# trace check, the Quint version; scripts/model-report.mjs lists them) carries
# `npm run model:full`'s report for its head in its body; this job only reads the body and fails
# until that report is there, names the head and passes. Editing the body re-runs it, so pasting
# the report after a push turns it green without another push. No dependencies, no model run.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: model-report-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/model-report.mjs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
