# Baton — BATON_SPEC §3. One Worker, one SQLite Durable Object (`Baton`, fixed name).
name = "baton"
main = "src/cloudflare/worker.ts"
compatibility_date = "2026-09-01"
routes = [{ pattern = "baton.immediately.run/*", zone_name = "immediately.run" }]

[[durable_objects.bindings]]
name = "BATON"
class_name = "Baton"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Baton"]

# The schema migrations, the dashboard's page and its stylesheet are bundled as text; the
# dashboard's one built ES module too (it is served to the browser, never imported by the
# Worker — built into src/dashboard/dist/ by `npm run build:ui`, which baton-deploy.yml runs
# before deploying because no pre-script runs there).
[[rules]]
type = "Text"
globs = ["**/*.sql", "**/*.html", "**/*.css", "**/dashboard/dist/*.js"]
fallthrough = false

[vars]
BATON_ORIGIN = "https://baton.immediately.run"
# R-BTN-15: the sync principal — GitHub Actions OIDC. Which repository a token acts for, and
# that its workflow is that repository's sync or mirror on its default branch, Baton reads from
# its registry (R-BTN-47), seeded here at start, insert-only, until R3-1240's admin route.
OIDC_ISSUER = "https://token.actions.githubusercontent.com"
OIDC_JWKS_URL = "https://token.actions.githubusercontent.com/.well-known/jwks"
# B-91: an entry carries its repository's `owner_keys` (R-BTN-58) — the owners `admin repo add`
# wrote — so a rebuilt instance serves the owner CLI with no manual re-add. A seeded owner is
# `added_by: admin:seed` and named in `baton admin repos` (seed_owners). Change here, or
# `admin repo add|set` changes an instance a deploy forgets.
BATON_REPOSITORIES = '[{"id":"docs","github":"immediately-run/docs","default_branch":"main","sync_workflow":".github/workflows/baton-sync.yml","mirror_workflow":".github/workflows/baton-mirror.yml","transcript_repos":["immediately-run/claude-sessions","immediately-run-worker/session-transcripts"]},{"id":"baton","github":"immediately-run/baton","default_branch":"main","sync_workflow":".github/workflows/baton-sync.yml","cut_over":true,"owner_keys":["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICsROXEEaWWm48HkvRsnQGdARW/3gLDlYBgJY5hWqNEX"]}]'
# R-BTN-16: the owner principal — Cloudflare Access. Set by the owner in R3-1208.
ACCESS_TEAM_DOMAIN = "mute-dew-600d.cloudflareaccess.com"
ACCESS_AUD = "326d8bf228bb8472d48a681888ae117f378e1182618c1d5e3f9e7d00e3b6e94d"
OWNER_EMAILS = "neumark.peter@gmail.com"
